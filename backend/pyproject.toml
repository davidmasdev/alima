[project]
name = "alima-backend"
version = "0.1.0"
description = "Backend API for Alima nutrition app"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13,<2.0",
    "bcrypt>=4.1,<5.0",
    "fastapi[standard]>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic-settings>=2.6,<3.0",
    "pyjwt>=2.9,<3.0",
    "sqlalchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
